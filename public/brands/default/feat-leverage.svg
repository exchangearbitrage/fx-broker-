<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="levBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C16" />
      <stop offset="100%" stop-color="#0A0E0B" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF61" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00FF61" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="360" rx="16" fill="url(#levBg)" stroke="#00FF61" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Gauge Arc / Multiplier Display -->
  <g transform="translate(270, 160)">
    <!-- Dial Track -->
    <path d="M -160 30 A 170 170 0 1 1 160 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="20" stroke-linecap="round"/>
    <!-- Active Dial Arc up to 100x -->
    <path d="M -160 30 A 170 170 0 1 1 135 -40" fill="none" stroke="url(#barGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Central Value Indicator -->
    <text x="0" y="-35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#A7B0A0" text-anchor="middle" letter-spacing="2">DYNAMIC MULTIPLIER</text>
    <text x="0" y="25" font-family="ui-monospace, monospace" font-size="64" font-weight="900" fill="#00FF61" text-anchor="middle" letter-spacing="-2">100x</text>
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#F8FAF7" text-anchor="middle">Margin Protection Active</text>

    <!-- Dial Tick Labels -->
    <text x="-165" y="60" font-family="ui-monospace, monospace" font-size="12" fill="#A7B0A0">2x</text>
    <text x="-140" y="-85" font-family="ui-monospace, monospace" font-size="12" fill="#A7B0A0">20x</text>
    <text x="0" y="-150" font-family="ui-monospace, monospace" font-size="12" fill="#A7B0A0">50x</text>
    <text x="135" y="-85" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#00FF61">100x</text>
  </g>

  <!-- Risk Guard Pill (Bottom) -->
  <g transform="translate(140, 275)">
    <rect width="260" height="42" rx="21" fill="#141C16" stroke="#00FF61" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="21" r="9" fill="#00FF61" fill-opacity="0.2"/>
    <path d="M25 21 L27 23 L32 18" stroke="#00FF61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAF7">Negative Balance Protection</text>
  </g>
</svg>
